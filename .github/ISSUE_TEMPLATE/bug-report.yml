name: Bug report
description: Report a reproducible problem with the extension.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Remove account names, email addresses, tokens, checkout URLs, and payment details from anything you share."
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "Example: 1.4.14"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, and installation method
      placeholder: "Example: Edge on Windows, unpacked ZIP from GitHub Releases"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the screen or action where the issue starts.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized screenshot or error message
