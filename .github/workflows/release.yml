name: Release browser extensions
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extension-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          package-manager-cache: false
      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node -e 'const v=require("./package.json").version;if(!/^(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$/.test(v))process.exit(1);process.stdout.write("v"+v)')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag must match package.json version"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > stable-tags.txt
          if ! node -e 'const fs=require("node:fs");const p=s=>s.replace(/^v/,"").split(".").map(Number);const v=p(process.argv[1]);const compare=a=>a[0]-v[0]||a[1]-v[1]||a[2]-v[2];process.exit(fs.readFileSync("stable-tags.txt","utf8").split(/\s+/).filter(s=>/^v\d+\.\d+\.\d+$/.test(s)).some(s=>compare(p(s))>=0)?1:0)' "$tag"; then
            echo "Version already released or older. Bump package.json for a new release." >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.plan.outputs.publish == 'true'
        run: npm install --no-audit --no-fund
      - if: steps.plan.outputs.publish == 'true'
        run: npm run typecheck && npm test && npm run build:all
      - if: steps.plan.outputs.publish == 'true'
        run: node scripts/check-manifest.mjs chrome && node scripts/check-manifest.mjs firefox
      - name: Package
        if: steps.plan.outputs.publish == 'true'
        run: |
          mkdir -p dist
          (cd .output/chrome-mv3 && zip -qr ../../dist/chrome.zip .)
          (cd .output/firefox-mv3 && zip -qr ../../dist/firefox-unsigned.zip .)
          (cd dist && sha256sum chrome.zip firefox-unsigned.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7.0.2
        if: steps.plan.outputs.publish == 'true'
        with:
          name: unsigned-firefox
          path: dist/firefox-unsigned.zip
      - name: Publish stable release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          tag_options=(--target "$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag_options=(--verify-tag)
          else
            existing=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
            if [[ -n "$existing" ]]; then
              tag_sha=$(printf '%s\n' "$existing" | tail -1 | cut -f1)
              test "$tag_sha" = "$GITHUB_SHA"
              tag_options=(--verify-tag)
            fi
          fi
          gh release create "$RELEASE_TAG" dist/chrome.zip dist/firefox-unsigned.zip dist/SHA256SUMS.txt \
            "${tag_options[@]}" --notes-file .github/release-notes.md --generate-notes --latest
  sign-firefox:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Detect signing credentials
        id: credentials
        run: |
          if [ -n "$WEB_EXT_API_KEY" ] && [ -n "$WEB_EXT_API_SECRET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing not configured; unsigned Firefox test build only." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.credentials.outputs.enabled == 'true'
      - uses: actions/setup-node@v7.1.0
        if: steps.credentials.outputs.enabled == 'true'
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        if: steps.credentials.outputs.enabled == 'true'
        with:
          name: unsigned-firefox
          path: dist
      - name: Sign unlisted Firefox add-on
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          mkdir -p firefox-build signed
          unzip -q dist/firefox-unsigned.zip -d firefox-build
          git archive --format=zip --output=source.zip HEAD
          npx --yes web-ext@8 sign --channel=unlisted --source-dir=firefox-build --artifacts-dir=signed --upload-source-code=source.zip
          find signed -name '*.xpi' -type f -print
          test "$(find signed -name '*.xpi' -type f | wc -l)" -eq 1
          cp "$(find signed -name '*.xpi' -type f)" dist/firefox.xpi
      - name: Publish native Firefox update
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          gh release upload "$RELEASE_TAG" dist/firefox.xpi
          node scripts/firefox-update-manifest.mjs "$RELEASE_TAG" dist/firefox.xpi > dist/updates.json
          if ! gh release view firefox-updates >/dev/null 2>&1; then
            gh release create firefox-updates --prerelease --title "Firefox native update feed" --notes "Machine-readable signed XPI update feed." --target "$GITHUB_SHA"
          fi
          gh release upload firefox-updates dist/updates.json --clobber
