name: Validate and package extensions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npx wxt build -b ${{ matrix.browser }} --mv3
      - run: node scripts/check-manifest.mjs ${{ matrix.browser }}
      - run: npx wxt zip -b ${{ matrix.browser }} --mv3
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: extension-${{ matrix.browser }}
          path: |
            .output/*.zip
            .output/${{ matrix.browser }}-mv3/**
          include-hidden-files: true
          if-no-files-found: error
