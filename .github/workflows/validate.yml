name: Validate and package extensions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: Type Check, Test & Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Hide stale downloads and show building status
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PREVIEW_PHASE: start
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const {GITHUB_REPOSITORY:repo,GITHUB_RUN_ID:run,GITHUB_RUN_ATTEMPT:attempt,PR_NUMBER:pr,PR_HEAD:head,PREVIEW_PHASE:phase,TEST_RESULT:test,BUILD_RESULT:build,JOB_RESULT:job,CHROME_ARTIFACT:chrome,EDGE_ARTIFACT:edge,OPERA_ARTIFACT:opera,FIREFOX_ARTIFACT:firefox,SCREENSHOT_ARTIFACT:screenshot}=process.env;
          if (!/^\d+$/.test(pr)||!/^\d+$/.test(run)||!/^\d+$/.test(attempt)||!/^\w+\/[\w.-]+$/.test(repo)||! /^[a-f0-9]{40}$/.test(head)) throw Error('Invalid PR metadata');
          const api=(...args)=>JSON.parse(execFileSync('gh',['api',...args],{encoding:'utf8'}));
          const endpoint='repos/'+repo;
          const current=()=>api(endpoint+'/pulls/'+pr);
          if(current().state!=='open'||current().head.sha!==head){console.log('PR moved; skip obsolete preview');process.exit(0);}
          const marker='<!-- offer-toolkit-build-preview -->';
          const comments=api(endpoint+'/issues/'+pr+'/comments?per_page=100','--paginate','--slurp').flat();
          const existing=comments.filter(c=>c.user?.login==='github-actions[bot]'&&c.body?.includes(marker)).at(-1);
          const last=existing?.body?.match(/<!-- preview-run:(\d+):(\d+) -->/);
          if(last&&(BigInt(last[1])>BigInt(run)||(last[1]===run&&BigInt(last[2])>BigInt(attempt)))){console.log('Newer run owns the preview');process.exit(0);}
          const runUrl='https://github.com/'+repo+'/actions/runs/'+run;
          let lines=['### Extension build preview','','Commit: `'+head.slice(0,7)+'`'];
          if(phase==='start'){
           lines.push('','⏳ **Building and testing…**','','Downloads will appear here only after all checks pass.');
          }else if(job==='success'&&test==='success'&&build==='success'){
           const selected=[chrome,edge,opera,firefox];
           if(selected.every(id=>typeof id==='string'&&/^\d+$/.test(id))){
            lines.push('','✅ **Build and tests passed**','','| Package | Download |','| --- | --- |');
            for(const [i,label] of ['Chrome / Brave / Vivaldi','Microsoft Edge','Opera / Opera GX','Firefox (unsigned)'].entries())lines.push('| '+label+' | [Download ZIP]('+runUrl+'/artifacts/'+selected[i]+') |');
            if(typeof screenshot==='string'&&/^\d+$/.test(screenshot))lines.push('| Popup screenshots | [Download ZIP]('+runUrl+'/artifacts/'+screenshot+') |');
            lines.push('','GitHub login may be required. Extract the downloaded ZIP once, then load the directory containing manifest.json. Artifacts expire according to repository retention settings.');
           }else lines.push('','⚠️ **Build finished, but required artifacts are missing.**','','Downloads withheld.');
          }else{
           lines.push('','❌ **Build did not pass**','','Tests: `'+(test||'skipped')+'` · Build: `'+(build||'skipped')+'` · Job: `'+job+'`','','Downloads withheld until a successful build.');
          }
          lines.push('','[View build log]('+runUrl+')','',marker,'<!-- preview-run:'+run+':'+attempt+' -->');
          const body=lines.join('\n');
          if(current().state!=='open'||current().head.sha!==head){console.log('PR changed during artifact lookup');process.exit(0);}
          if(existing)api(endpoint+'/issues/comments/'+existing.id,'-X','PATCH','-f','body='+body);
          else api(endpoint+'/issues/'+pr+'/comments','-X','POST','-f','body='+body);
          NODE
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          check-latest: false
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies once
        run: npm install --no-audit --no-fund
      - name: Typecheck and unit tests
        id: tests
        run: npm run typecheck && npm test
      - name: Build and validate all browser targets
        id: build
        run: |
          set -euo pipefail
          for browser in chrome edge opera firefox; do
            npx --no-install wxt build -b "$browser" --mv3
            node scripts/check-manifest.mjs "$browser"
          done
      - name: Install Chromium (optional)
        if: vars.RUN_POPUP_PLAYWRIGHT == 'true'
        run: npx playwright install --with-deps chromium
      - name: Test popup (optional)
        if: vars.RUN_POPUP_PLAYWRIGHT == 'true'
        run: npm run test:popup
      - name: Upload popup screenshots (optional)
        id: screenshots
        if: ${{ always() && vars.RUN_POPUP_PLAYWRIGHT == 'true' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: popup-screenshots
          path: artifacts/popup/*.png
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - name: Upload Chrome package
        id: chrome
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chatgpt-offer-toolkit-chrome
          path: .output/chrome-mv3/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Upload Microsoft Edge package
        id: edge
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chatgpt-offer-toolkit-edge
          path: .output/edge-mv3/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Upload Opera package
        id: opera
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chatgpt-offer-toolkit-opera
          path: .output/opera-mv3/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Upload Firefox package
        id: firefox
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chatgpt-offer-toolkit-firefox
          path: .output/firefox-mv3/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Publish validated build downloads
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PREVIEW_PHASE: finish
          TEST_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          JOB_RESULT: ${{ job.status }}
          CHROME_ARTIFACT: ${{ steps.chrome.outputs.artifact-id }}
          EDGE_ARTIFACT: ${{ steps.edge.outputs.artifact-id }}
          OPERA_ARTIFACT: ${{ steps.opera.outputs.artifact-id }}
          FIREFOX_ARTIFACT: ${{ steps.firefox.outputs.artifact-id }}
          SCREENSHOT_ARTIFACT: ${{ steps.screenshots.outputs.artifact-id }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const {GITHUB_REPOSITORY:repo,GITHUB_RUN_ID:run,GITHUB_RUN_ATTEMPT:attempt,PR_NUMBER:pr,PR_HEAD:head,PREVIEW_PHASE:phase,TEST_RESULT:test,BUILD_RESULT:build,JOB_RESULT:job,CHROME_ARTIFACT:chrome,EDGE_ARTIFACT:edge,OPERA_ARTIFACT:opera,FIREFOX_ARTIFACT:firefox,SCREENSHOT_ARTIFACT:screenshot}=process.env;
          if (!/^\d+$/.test(pr)||!/^\d+$/.test(run)||!/^\d+$/.test(attempt)||!/^\w+\/[\w.-]+$/.test(repo)||! /^[a-f0-9]{40}$/.test(head)) throw Error('Invalid PR metadata');
          const api=(...args)=>JSON.parse(execFileSync('gh',['api',...args],{encoding:'utf8'}));
          const endpoint='repos/'+repo;
          const current=()=>api(endpoint+'/pulls/'+pr);
          if(current().state!=='open'||current().head.sha!==head){console.log('PR moved; skip obsolete preview');process.exit(0);}
          const marker='<!-- offer-toolkit-build-preview -->';
          const comments=api(endpoint+'/issues/'+pr+'/comments?per_page=100','--paginate','--slurp').flat();
          const existing=comments.filter(c=>c.user?.login==='github-actions[bot]'&&c.body?.includes(marker)).at(-1);
          const last=existing?.body?.match(/<!-- preview-run:(\d+):(\d+) -->/);
          if(last&&(BigInt(last[1])>BigInt(run)||(last[1]===run&&BigInt(last[2])>BigInt(attempt)))){console.log('Newer run owns the preview');process.exit(0);}
          const runUrl='https://github.com/'+repo+'/actions/runs/'+run;
          let lines=['### Extension build preview','','Commit: `'+head.slice(0,7)+'`'];
          if(phase==='start'){
           lines.push('','⏳ **Building and testing…**','','Downloads will appear here only after all checks pass.');
          }else if(job==='success'&&test==='success'&&build==='success'){
           const selected=[chrome,edge,opera,firefox];
           if(selected.every(id=>typeof id==='string'&&/^\d+$/.test(id))){
            lines.push('','✅ **Build and tests passed**','','| Package | Download |','| --- | --- |');
            for(const [i,label] of ['Chrome / Brave / Vivaldi','Microsoft Edge','Opera / Opera GX','Firefox (unsigned)'].entries())lines.push('| '+label+' | [Download ZIP]('+runUrl+'/artifacts/'+selected[i]+') |');
            if(typeof screenshot==='string'&&/^\d+$/.test(screenshot))lines.push('| Popup screenshots | [Download ZIP]('+runUrl+'/artifacts/'+screenshot+') |');
            lines.push('','GitHub login may be required. Extract the downloaded ZIP once, then load the directory containing manifest.json. Artifacts expire according to repository retention settings.');
           }else lines.push('','⚠️ **Build finished, but required artifacts are missing.**','','Downloads withheld.');
          }else{
           lines.push('','❌ **Build did not pass**','','Tests: `'+(test||'skipped')+'` · Build: `'+(build||'skipped')+'` · Job: `'+job+'`','','Downloads withheld until a successful build.');
          }
          lines.push('','[View build log]('+runUrl+')','',marker,'<!-- preview-run:'+run+':'+attempt+' -->');
          const body=lines.join('\n');
          if(current().state!=='open'||current().head.sha!==head){console.log('PR changed during artifact lookup');process.exit(0);}
          if(existing)api(endpoint+'/issues/comments/'+existing.id,'-X','PATCH','-f','body='+body);
          else api(endpoint+'/issues/'+pr+'/comments','-X','POST','-f','body='+body);
          NODE
