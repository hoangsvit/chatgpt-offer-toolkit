<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ChatGPT Offer Toolkit</title><link rel="stylesheet" href="popup.css"></head>
<body><header><span class="eyebrow">UNOFFICIAL TOOLKIT</span><h1>ChatGPT Offer Toolkit</h1><p>Business · Monthly checkout</p></header>
<form id="settings"><label>Workspace name<input id="workspace" required maxlength="100" value="MyTeam"></label>
<div class="grid"><label>Seats<input id="seats" type="number" min="2" max="100" step="1" required value="5"></label><label>Country (ISO)<input id="country" required maxlength="2" pattern="[A-Za-z]{2}" value="VN"></label></div>
<label>Currency (ISO)<input id="currency" required maxlength="3" pattern="[A-Za-z]{3}" value="USD"></label>
<div class="offer"><strong>Campaign: one month free</strong><span>Subject to eligibility. Use your actual billing details. Review the total and renewal price before subscribing.</span></div>
<button id="generate" type="submit">Generate checkout link</button></form>
<p id="status" role="status" aria-live="polite"></p>
<section id="result" hidden><label>Checkout link<input id="link" readonly></label><div class="grid"><button id="copy" type="button" class="secondary">Copy link</button><button id="open" type="button">Open checkout</button></div></section>
<button id="official" type="button" class="secondary">Open official offer page</button><footer>No telemetry. No stored tokens. No automatic payment.</footer>
<script src="checkout.js"></script><script src="popup.js"></script></body></html>
